<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabTrack â€” Sign In</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/forms.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-animate.min.js"></script>
  <script src="js/angular-app.js?v=2"></script>
</head>
<body class="auth-page" ng-app="labTrackApp" ng-controller="AuthController">
  <main class="auth-card wide" aria-labelledby="auth-heading">
    <aside class="auth-brand-panel">
      <a href="index.html" class="logo-link" style="color:#fff;margin-bottom:2rem">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="14" r="3"/><path d="M12 2v4M8 6h8"/></svg>
        LabTrack
      </a>
      <h2 style="font-size:1.75rem;margin:0 0 1rem">Precision in every process.</h2>
      <p style="opacity:0.9;margin:0">Streamline bookings, manage inventory, and maintain operational records with clinical efficiency.</p>
    </aside>

    <section class="auth-form-panel">
      <div class="auth-logo-box" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="14" r="3"/><path d="M12 2v4M8 6h8"/></svg>
      </div>
      <h1 id="auth-heading">LabTrack</h1>
      <p class="auth-sub">Management System</p>
      <p style="text-align:center;font-size:0.95rem;font-weight:600;color:#1f2937;margin:0 0 1.5rem">Sign In to your account</p>

      <form id="loginForm" ng-submit="doLogin()" novalidate>
        <div class="form-message" role="status" ng-show="loginError" style="color:#dc2626;margin-bottom:1rem;font-size:0.9rem">{{loginError}}</div>
        <div class="field-wrap">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" name="loginEmail" ng-model="user.email" placeholder="Enter your email" required autocomplete="email">
          <span class="validation-thumb" aria-hidden="true"></span>
          <span class="field-error"></span>
        </div>
        <div class="field-wrap">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="loginPassword" ng-model="user.password" placeholder="Enter your password" required autocomplete="current-password">
          <span class="validation-thumb" aria-hidden="true"></span>
          <span class="field-error"></span>
        </div>
        <div class="auth-row">
          <label><input type="checkbox" name="remember"> Remember me</label>
          <a href="#">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block" ng-disabled="loading">
          <span ng-show="!loading">Sign In &rarr;</span>
          <span ng-show="loading">Signing in...</span>
        </button>
      </form>

      <hr class="auth-divider">
      <p style="text-align:center;font-size:0.9rem;color:#6b7280">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
